services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  db-init:
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env.production}

  server:
    env_file: !reset []
    ports: !override
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      AUTH_PUBLIC_API_BASE_URL: ${AUTH_PUBLIC_API_BASE_URL:?Set AUTH_PUBLIC_API_BASE_URL in .env.production}
      AUTH_TRUST_FORWARD_HEADERS: ${AUTH_TRUST_FORWARD_HEADERS:?Set AUTH_TRUST_FORWARD_HEADERS in .env.production}
      AUTH_ALLOW_INSECURE_PRODUCTION_DEFAULTS: ${AUTH_ALLOW_INSECURE_PRODUCTION_DEFAULTS:?Set AUTH_ALLOW_INSECURE_PRODUCTION_DEFAULTS=false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-ssoo-session}
      AUTH_SESSION_COOKIE_DOMAIN: ${AUTH_SESSION_COOKIE_DOMAIN:-}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:?Set AUTH_SESSION_COOKIE_SECURE=true}
      AUTH_SESSION_COOKIE_SAME_SITE: ${AUTH_SESSION_COOKIE_SAME_SITE:?Set AUTH_SESSION_COOKIE_SAME_SITE in .env.production}
      AUTH_OAUTH_STATE_SIGNING_SECRET: ${AUTH_OAUTH_STATE_SIGNING_SECRET:?Set AUTH_OAUTH_STATE_SIGNING_SECRET in .env.production}
      AUTH_CONFIG_ENCRYPTION_KEY: ${AUTH_CONFIG_ENCRYPTION_KEY:?Set AUTH_CONFIG_ENCRYPTION_KEY in .env.production}
      AUTH_DEFAULT_LOGIN_URL: ${AUTH_DEFAULT_LOGIN_URL:?Set AUTH_DEFAULT_LOGIN_URL in .env.production}
      DMS_INSTANCE_ENV: ${DMS_INSTANCE_ENV:?Set DMS_INSTANCE_ENV=prod}
      DMS_GIT_PROD_REMOTE_URL: ${DMS_GIT_PROD_REMOTE_URL:?Set DMS_GIT_PROD_REMOTE_URL in .env.production}
    volumes:
      - ${DMS_MARKDOWN_HOST_PATH:?Set absolute DMS_MARKDOWN_HOST_PATH}:${DMS_MARKDOWN_ROOT:-/var/lib/ssoo/documents}
      - ${DMS_INGEST_HOST_PATH:?Set absolute DMS_INGEST_HOST_PATH}:${DMS_INGEST_QUEUE_PATH:-/var/lib/ssoo/document-ingest}
      - ${DMS_STORAGE_LOCAL_HOST_PATH:?Set absolute DMS_STORAGE_LOCAL_HOST_PATH}:${DMS_STORAGE_LOCAL_BASE_PATH:-/var/lib/ssoo/document-storage/local}

  admin:
    ports: !override
      - "127.0.0.1:3000:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${ADMIN_NEXT_PUBLIC_API_URL:?Set ADMIN_NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
        NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
        NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
        NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
        NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}
    environment:
      NEXT_PUBLIC_API_URL: ${ADMIN_NEXT_PUBLIC_API_URL:?Set ADMIN_NEXT_PUBLIC_API_URL in .env.production}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
      NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
      NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
      NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
      NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}

  crm:
    ports: !override
      - "127.0.0.1:3001:3001"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${CRM_NEXT_PUBLIC_API_URL:?Set CRM_NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
        NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
        NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
        NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
        NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}
    environment:
      NEXT_PUBLIC_API_URL: ${CRM_NEXT_PUBLIC_API_URL:?Set CRM_NEXT_PUBLIC_API_URL in .env.production}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
      NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
      NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
      NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
      NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}

  pms:
    ports: !override
      - "127.0.0.1:3002:3002"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${PMS_NEXT_PUBLIC_API_URL:?Set PMS_NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
        NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
        NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
        NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
        NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}
    environment:
      NEXT_PUBLIC_API_URL: ${PMS_NEXT_PUBLIC_API_URL:?Set PMS_NEXT_PUBLIC_API_URL in .env.production}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
      NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
      NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
      NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
      NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}

  dms:
    env_file: !reset []
    ports: !override
      - "127.0.0.1:3003:3003"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${DMS_NEXT_PUBLIC_API_URL:?Set DMS_NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_WS_URL: ${DMS_NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
        NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
        NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
        NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
        NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env.production}
      DMS_DATABASE_URL: ${DOCKER_DMS_DATABASE_URL:?Set DOCKER_DMS_DATABASE_URL in .env.production}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
      NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
      NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
      NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
      NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}

  sns:
    ports: !override
      - "127.0.0.1:3004:3004"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${SNS_NEXT_PUBLIC_API_URL:?Set SNS_NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
        NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
        NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
        NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
        NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}
    environment:
      NEXT_PUBLIC_API_URL: ${SNS_NEXT_PUBLIC_API_URL:?Set SNS_NEXT_PUBLIC_API_URL in .env.production}
      NEXT_PUBLIC_ADMIN_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:?Set NEXT_PUBLIC_ADMIN_APP_URL in .env.production}
      NEXT_PUBLIC_CRM_APP_URL: ${NEXT_PUBLIC_CRM_APP_URL:?Set NEXT_PUBLIC_CRM_APP_URL in .env.production}
      NEXT_PUBLIC_PMS_APP_URL: ${NEXT_PUBLIC_PMS_APP_URL:?Set NEXT_PUBLIC_PMS_APP_URL in .env.production}
      NEXT_PUBLIC_DMS_APP_URL: ${NEXT_PUBLIC_DMS_APP_URL:?Set NEXT_PUBLIC_DMS_APP_URL in .env.production}
      NEXT_PUBLIC_SNS_APP_URL: ${NEXT_PUBLIC_SNS_APP_URL:?Set NEXT_PUBLIC_SNS_APP_URL in .env.production}
