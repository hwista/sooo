# AI/RAG runtime verification is intentionally manual.
# Provider-ready mode requires Azure OpenAI embedding configuration and a live Docker stack.

name: AI/RAG Runtime Verification

on:
  workflow_dispatch:
    inputs:
      provider_mode:
        description: Runtime smoke expectation.
        required: true
        default: ready
        type: choice
        options:
          - ready
          - unavailable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.provider_mode }}
  cancel-in-progress: false

jobs:
  runtime-smoke:
    name: Runtime Smoke (${{ inputs.provider_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://ssoo:ssoo_dev_pw@localhost:5432/ssoo_dev?schema=public
      DOCKER_DATABASE_URL: postgresql://ssoo:ssoo_dev_pw@postgres:5432/ssoo_dev?schema=public
      AI_RAG_SMOKE_BASE_URL: http://127.0.0.1:4000/api
      AI_RAG_SMOKE_REPORT_PATH: output/ai-rag-runtime-smoke-${{ inputs.provider_mode }}.json
      AI_RAG_SMOKE_SUMMARY_PATH: output/ai-rag-runtime-smoke-${{ inputs.provider_mode }}.md
      AI_RAG_PROVIDER_READY_EVIDENCE_BLOCK_PATH: output/ai-rag-provider-ready-evidence-${{ inputs.provider_mode }}.md
      AI_RAG_WORKFLOW_PROVIDER_MODE: ${{ inputs.provider_mode }}
      DMS_INSTANCE_ENV: local-test
      DMS_GIT_BOOTSTRAP_REMOTE_URL: ''
      DMS_GIT_PUBLISH_IGNORED_PATH_PREFIXES: launch-smoke/,codex-lock-ui/,codex-lock-probe/,verify-access/,verify-ai-rag/
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DIMENSION: ${{ vars.AZURE_OPENAI_EMBEDDING_DIMENSION }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_USE_MANAGED_IDENTITY: ${{ vars.AZURE_USE_MANAGED_IDENTITY }}
      AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ secrets.AZURE_MANAGED_IDENTITY_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write server runtime env
        shell: bash
        run: |
          {
            echo "DOCKER_DATABASE_URL=${DOCKER_DATABASE_URL}"
            echo "DMS_INSTANCE_ENV=${DMS_INSTANCE_ENV}"
            echo "DMS_GIT_BOOTSTRAP_REMOTE_URL=${DMS_GIT_BOOTSTRAP_REMOTE_URL}"
            echo "DMS_GIT_PUBLISH_IGNORED_PATH_PREFIXES=${DMS_GIT_PUBLISH_IGNORED_PATH_PREFIXES}"
            if [[ "${AI_RAG_WORKFLOW_PROVIDER_MODE}" == "ready" ]]; then
              echo "AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}"
              echo "AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}"
              echo "AZURE_OPENAI_EMBEDDING_DIMENSION=${AZURE_OPENAI_EMBEDDING_DIMENSION}"
              echo "AZURE_OPENAI_CHAT_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT}"
              echo "AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}"
              echo "AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}"
              echo "AZURE_TENANT_ID=${AZURE_TENANT_ID}"
              echo "AZURE_CLIENT_ID=${AZURE_CLIENT_ID}"
              echo "AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}"
              echo "AZURE_USE_MANAGED_IDENTITY=${AZURE_USE_MANAGED_IDENTITY}"
              echo "AZURE_MANAGED_IDENTITY_CLIENT_ID=${AZURE_MANAGED_IDENTITY_CLIENT_ID}"
            else
              echo "AZURE_OPENAI_ENDPOINT="
              echo "AZURE_OPENAI_EMBEDDING_DEPLOYMENT=<embedding-deployment>"
              echo "AZURE_OPENAI_EMBEDDING_DIMENSION="
              echo "AZURE_OPENAI_CHAT_DEPLOYMENT="
              echo "AZURE_OPENAI_DEPLOYMENT="
              echo "AZURE_OPENAI_API_KEY="
              echo "AZURE_TENANT_ID="
              echo "AZURE_CLIENT_ID="
              echo "AZURE_CLIENT_SECRET="
              echo "AZURE_USE_MANAGED_IDENTITY=false"
              echo "AZURE_MANAGED_IDENTITY_CLIENT_ID="
            fi
          } > .env

      - name: Start Docker runtime
        if: ${{ inputs.provider_mode == 'unavailable' }}
        shell: bash
        run: |
          cleanup() {
            status=$?
            if [[ "$status" -ne 0 ]]; then
              docker compose -f compose.yaml -f compose.local.yaml logs server db-init postgres || true
              docker compose -f compose.yaml -f compose.local.yaml down --volumes --remove-orphans || true
            fi
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT

          docker compose -f compose.yaml -f compose.local.yaml down --volumes --remove-orphans || true
          docker compose -f compose.yaml -f compose.local.yaml up -d --build server

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:4000/api/health >/dev/null

      - name: Run provider-unavailable runtime smoke
        if: ${{ inputs.provider_mode == 'unavailable' }}
        run: pnpm run verify:ai-rag-runtime:unavailable

      - name: Run provider-ready completion flow
        if: ${{ inputs.provider_mode == 'ready' }}
        run: pnpm run complete:ai-rag-central-foundation -- --docker-runtime --docker-runtime-cleanup --dry-run --report="${AI_RAG_SMOKE_REPORT_PATH}" --summary="${AI_RAG_SMOKE_SUMMARY_PATH}" --workflow-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --evidence-block-path="${AI_RAG_PROVIDER_READY_EVIDENCE_BLOCK_PATH}"

      - name: Verify runtime smoke report
        if: ${{ inputs.provider_mode == 'unavailable' }}
        run: pnpm run verify:ai-rag-runtime-report -- --provider-mode=${{ inputs.provider_mode }} --path="${AI_RAG_SMOKE_REPORT_PATH}" --summary-path="${AI_RAG_SMOKE_SUMMARY_PATH}"

      - name: Upload runtime smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-rag-runtime-smoke-${{ inputs.provider_mode }}
          path: |
            output/ai-rag-runtime-smoke-*.json
            output/ai-rag-runtime-smoke-*.md
            output/ai-rag-provider-ready-evidence-*.md
          if-no-files-found: ignore

      - name: Dump runtime logs on failure
        if: ${{ failure() && inputs.provider_mode == 'unavailable' }}
        run: docker compose -f compose.yaml -f compose.local.yaml logs server db-init postgres || true

      - name: Stop Docker runtime
        if: ${{ always() && inputs.provider_mode == 'unavailable' }}
        run: docker compose -f compose.yaml -f compose.local.yaml down --volumes --remove-orphans
